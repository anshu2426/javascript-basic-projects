<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number guesser game</title>
  </head>
  <body>
    <div
      class="container"
      style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      "
    >
      <h1>Number guesser game</h1>
      <div
        class="box"
        style="
          width: 200px;
          height: 200px;
          background-color: lightgray;
          text-align: center;
          padding: 20px;
          border-radius: 10px;
          border: 1px solid black;
        "
      >
        <h2 id="message">guess a number between 1 and 100</h2>
        <input
          type="text"
          id="inp"
          style="padding: 10px; border-radius: 5px; border: 1px solid #ccc"
        />
        <button id="btn">guess</button>
        <h3 id="result">result:NaN</h3>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
