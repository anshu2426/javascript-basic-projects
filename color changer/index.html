<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>color changer</title>
  </head>
  <body id="bg">
    <div
      style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      "
    >
      <h1>Color changer</h1>
      <button class="btn" style="background: red; padding: 20px">red</button>
      <button class="btn" style="background: blue; padding: 20px">blue</button>
      <button class="btn" style="background: green; padding: 20px">
        green
      </button>
      <button class="btn" style="background: yellow; padding: 20px">
        yellow
      </button>
      <button class="btn" style="background: purple; padding: 20px">
        purple
      </button>
      <button class="btn" style="background: orange; padding: 20px">
        orange
      </button>
    </div>
  </body>
  <script src="index.js"></script>
</html>
