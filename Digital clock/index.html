<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital clock</title>
  </head>
  <body>
    <div
      class="container"
      style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 20px;
      "
    >
      <h1>Digital Clock</h1>
      <div
        class="box"
        style="
          width: 300px;
          height: 150px;
          border: 1px solid black;
          padding: 20px;
          border-radius: 10px;
          background: gray;
          text-align: center;
          gap: 10px;
        "
      >
        <h2
          id="time"
          style="background-color: white; border: 1px solid black; padding: 5px"
        >
          00:00:00
        </h2>
        <h2
          id="date"
          style="background-color: white; border: 1px solid black; padding: 5px"
        >
          01/01/1970
        </h2>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
